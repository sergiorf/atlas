atlas {
  status-dir = "data/_atlas/status"
  status-dir = ${?ATLAS_STATUS_DIR}
  output.write-mode = "overwrite"
  csv {
    delimiter = ";"
    encoding = "ISO-8859-1"
  } 
  spark {
    app-name = "atlas-etl"
    master = "local[*]"
    shuffle-partitions = 64
    local-dir = "spark-tmp"
    local-dir = ${?ATLAS_SPARK_LOCAL_DIR}
  }
  receita {
    snapshot = "2026-06"
    snapshot = ${?ATLAS_RECEITA_SNAPSHOT}
    raw-dir = "data/raw/receita/2026-06/estabelecimentos/extracted"
    raw-dir = ${?ATLAS_RECEITA_RAW_DIR}
    company-data-raw-dir = "data/raw/receita/2026-06/company-data"
    company-data-raw-dir = ${?ATLAS_RECEITA_COMPANY_DATA_RAW_DIR}
    bronze-dir = "data/bronze/receita"
    bronze-dir = ${?ATLAS_RECEITA_BRONZE_DIR}
    silver-dir = "data/silver/receita"
    silver-dir = ${?ATLAS_RECEITA_SILVER_DIR}
  }
}
