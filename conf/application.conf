atlas-etl {
  input.estabelecimentos-glob = "data/raw/2026-06/estabelecimentos/extracted/*"
  input.estabelecimentos-glob = ${?ATLAS_ETL_INPUT_GLOB}
  output {
    base-directory = "data/parquet"
    mode = "overwrite"
  }
  csv {
    delimiter = ";"
    encoding = "ISO-8859-1"
  }
  spark {
    master = "local[*]"
    app-name = "atlas-etl"
    shuffle-partitions = 8
  }
  sample {
    enabled = false
    max-rows = 10000
  }
}
